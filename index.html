<style>
  :root {
    --ink: #0d3a31;
    --ink-2: #155246;
    --paper: #f5f2ea;
    --card: #fffdf8;
    --well: #ebe6d7;
    --gold: #b8903a;
    --red: #a92a2f;
    --text: #1d2a27;
    --muted: #5d6b67;
    --line: #d9d3c3;
    --radius: 4px;
    --max: 1180px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
    font-size: 17px; line-height: 1.8; color: var(--text); background: var(--paper);
  }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  h1, h2, h3 { font-family: "Reem Kufi", "IBM Plex Sans Arabic", sans-serif; font-weight: 700; line-height: 1.3; color: var(--ink); }
  .wrap { width: min(var(--max), 92%); margin-inline: auto; }
  [hidden] { display: none !important; }

  /* Logo: image with a seal fallback when the image cannot load */
  .logo { position: relative; display: inline-grid; place-items: center; width: 46px; height: 46px; flex: none; }
  .logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; background: #fff2; }
  .logo .fb { display: none; width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--gold); place-items: center; font-family: "Reem Kufi", sans-serif; font-weight: 700; color: var(--gold); background: #0d3a31; }
  .logo.nologo img { display: none; }
  .logo.nologo .fb { display: grid; }
  .logo.foot-logo { width: 52px; height: 52px; margin-bottom: 12px; }

  /* Announcement bar */
  .announce { background: var(--gold); color: #fff; text-align: center; padding: 10px 16px; font-weight: 500; font-size: .95rem; }
  .announce.admin-only { background: var(--red); }

  /* Header */
  header.top { position: sticky; top: 0; z-index: 50; background: var(--ink); color: #fff; border-bottom: 2px solid var(--gold); }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand b { font-family: "Reem Kufi", sans-serif; font-size: 1.1rem; display: block; line-height: 1.2; }
  .brand small { opacity: .75; font-size: .8rem; }
  nav.main { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.main a { text-decoration: none; font-size: .95rem; padding: 8px 12px; border-radius: var(--radius); opacity: .9; }
  nav.main a:hover { background: #ffffff1a; opacity: 1; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: .95rem; padding: 10px 18px; border-radius: var(--radius); text-decoration: none; border: 1.5px solid transparent; cursor: pointer; transition: background .2s, color .2s; }
  .btn-gold { background: var(--gold); color: #fff; }
  .btn-gold:hover { background: #9c7628; }
  .btn-ghost { border-color: #ffffff80; color: #fff; background: transparent; }
  .btn-ghost:hover { background: #ffffff1a; }
  .btn-dark { background: var(--ink); color: #fff; }
  .btn-dark:hover { background: var(--ink-2); }
  .menu-btn { display: none; background: transparent; color: #fff; border: 1px solid #ffffff55; padding: 8px 12px; border-radius: var(--radius); cursor: pointer; }

  /* Hero */
  .hero { background: var(--ink); color: #fff; padding: 96px 0 88px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; inset-inline-end: -120px; top: -120px; width: 520px; height: 520px; border-radius: 50%; border: 1px solid #b8903a55; box-shadow: 0 0 0 60px #b8903a0d, 0 0 0 120px #b8903a08; pointer-events: none; }
  .hero .wrap { position: relative; z-index: 1; max-width: 760px; }
  .hero .kicker { color: #e3c57f; font-weight: 500; margin-bottom: 18px; }
  .hero h1 { color: #fff; font-size: clamp(2.4rem, 5.5vw, 4.2rem); margin-bottom: 22px; }
  .hero .lead { font-size: 1.15rem; color: #d7e6e1; max-width: 60ch; margin-bottom: 36px; }
  .hero .btns { gap: 12px; }

  /* Stats */
  .stats { background: var(--card); border-bottom: 1px solid var(--line); }
  .stats .wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .stat { padding: 28px 16px; border-inline-start: 1px solid var(--line); }
  .stat strong { display: block; font-family: "Reem Kufi", sans-serif; font-size: 2.2rem; color: var(--ink); line-height: 1.1; }
  .stat span { color: var(--muted); font-size: .92rem; }

  /* Sections */
  section { padding: 84px 0; }
  section + section { border-top: 1px solid var(--line); }
  .sec-head { max-width: 680px; margin-bottom: 44px; }
  .sec-head h2 { font-size: clamp(1.8rem, 3.4vw, 2.5rem); margin-bottom: 10px; }
  .sec-head p { color: var(--muted); }

  /* About */
  .about { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: start; }
  .about h2 { font-size: clamp(1.8rem, 3.4vw, 2.5rem); margin-bottom: 14px; }
  .about p + p { margin-top: 14px; }
  .principles { display: grid; gap: 14px; }
  .principle { background: var(--card); border: 1px solid var(--line); border-inline-start: 4px solid var(--ink); padding: 20px 22px; border-radius: var(--radius); }
  .principle h3 { font-size: 1.1rem; margin-bottom: 4px; }
  .principle p { color: var(--muted); font-size: .97rem; }

  /* Media frames: fixed ratio, image is never cropped */
  .media { position: relative; background: var(--well); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .media img { width: 100%; height: 100%; object-fit: contain; }
  .media.broken img, .media.empty img { display: none; }
  .media.broken::after, .media.empty::after { font-size: .9rem; color: var(--muted); padding: 12px; text-align: center; }
  .media.empty::after { content: "بدون صورة"; }
  .media.broken::after { content: "تعذر تحميل الصورة"; }
  .media[data-zoom-src] { cursor: zoom-in; }

  /* Ranks */
  .ladder { display: grid; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .rank { display: grid; grid-template-columns: 200px 1fr; border-bottom: 1px solid var(--line); }
  .rank:last-child { border-bottom: 0; }
  .rank-media { aspect-ratio: 3 / 4; height: 100%; }
  .rank-body { padding: 22px 28px; align-self: center; }
  .rank-body .tier { font-size: .85rem; color: var(--gold); font-weight: 600; }
  .rank-body h3 { font-size: 1.35rem; margin: 2px 0 6px; }
  .rank-body p { color: var(--muted); font-size: .97rem; }

  .ugroup { margin-top: 64px; }
  .ugroup > h3 { font-size: 1.35rem; margin-bottom: 6px; padding-inline-start: 14px; border-inline-start: 3px solid var(--gold); }
  .ugroup > p { color: var(--muted); margin-bottom: 22px; padding-inline-start: 17px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .ufig { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .ufig .media { aspect-ratio: 4 / 3; }
  .ufig figcaption { padding: 12px 14px; font-weight: 600; font-size: .95rem; color: var(--ink); }

  /* Battalions */
  .battalions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .bat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; display: flex; flex-direction: column; gap: 12px; }
  .bat.featured { border-color: var(--ink); box-shadow: inset 0 3px 0 var(--ink); }
  .bat.soon { background: var(--well); }
  .bat-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .bat h3 { font-size: 1.3rem; }
  .bat .code { direction: ltr; font-size: .8rem; font-weight: 600; color: var(--ink-2); background: #e6eee9; padding: 3px 10px; border-radius: 99px; }
  .bat p { color: var(--muted); }
  .bat .cmd { margin-top: auto; padding-top: 14px; border-top: 1px dashed var(--line); font-size: .92rem; }
  .bat .cmd b { color: var(--ink); }
  .badge-soon { color: var(--red); font-weight: 600; font-size: .9rem; }

  /* Departments */
  .depts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .dept { padding: 26px 28px; background: var(--ink); color: #e9f1ee; border-radius: var(--radius); }
  .dept h3 { color: #fff; font-size: 1.25rem; margin-bottom: 8px; }
  .dept p { color: #c9dcd5; font-size: .98rem; }
  .dept ul { list-style: none; margin-top: 14px; display: grid; gap: 8px; }
  .dept li { padding-inline-start: 18px; position: relative; font-size: .95rem; color: #dfeae6; }
  .dept li::before { content: ""; position: absolute; inset-inline-start: 0; top: .7em; width: 7px; height: 7px; background: var(--gold); border-radius: 50%; }

  /* Leadership */
  .leaders { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .leader { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; }
  .seal { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--gold); display: grid; place-items: center; font-family: "Reem Kufi", sans-serif; color: var(--ink); font-weight: 700; font-size: 1.1rem; background: #faf6ea; }
  .leader .role { font-size: .85rem; color: var(--gold); font-weight: 600; }
  .leader h3 { font-size: 1.15rem; }
  .leader .meta { font-size: .9rem; color: var(--muted); }
  .leader time { display: block; font-size: .82rem; color: var(--muted); margin-top: 4px; }
  .ltr { direction: ltr; display: inline-block; }
  .leader.top { grid-column: 1 / -1; background: var(--ink); border-color: var(--ink); }
  .leader.top h3, .leader.top .role { color: #fff; }
  .leader.top .role { color: #e3c57f; }
  .leader.top .meta, .leader.top time { color: #c9dcd5; }
  .leader.top .seal { background: transparent; color: #fff; border-color: #e3c57f; }

  /* CTA */
  .cta { background: var(--gold); color: #fff; padding: 64px 0; }
  .cta .wrap { display: flex; align-items: center; justify-content: space-between; gap: 28px; flex-wrap: wrap; }
  .cta h2 { color: #fff; font-size: clamp(1.6rem, 3vw, 2.2rem); margin-bottom: 6px; }
  .cta p { color: #fff8e8; }
  .cta .btn-dark { padding: 14px 26px; font-size: 1rem; }

  /* FAQ */
  .faq { max-width: 820px; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px; margin-bottom: 10px; }
  details summary { cursor: pointer; font-weight: 600; color: var(--ink); list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: "+"; font-size: 1.4rem; line-height: 1; color: var(--gold); }
  details[open] summary::after { content: "−"; }
  details p { margin-top: 10px; color: var(--muted); }

  /* Footer */
  footer { background: #082720; color: #bcd0c9; padding: 56px 0 28px; font-size: .95rem; }
  footer .cols { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 36px; }
  footer h4 { font-family: "Reem Kufi", sans-serif; color: #fff; font-size: 1.05rem; margin-bottom: 12px; }
  footer a, footer .linkbtn { text-decoration: none; display: block; padding: 3px 0; color: #bcd0c9; background: none; border: 0; cursor: pointer; text-align: start; font-size: .95rem; }
  footer a:hover, footer .linkbtn:hover { color: #e3c57f; }
  footer .legal { margin-top: 40px; padding-top: 20px; border-top: 1px solid #ffffff1a; font-size: .85rem; opacity: .75; }

  /* Modals: lightbox, login */
  .overlay { position: fixed; inset: 0; background: #041d18e6; display: grid; place-items: center; padding: 24px; z-index: 100; }
  .lb-img { max-width: min(1000px, 100%); max-height: 86vh; border-radius: var(--radius); background: #fff; }
  .x-btn { position: absolute; top: 16px; inset-inline-end: 16px; background: #fff; border: 0; width: 42px; height: 42px; border-radius: 50%; font-size: 1.4rem; cursor: pointer; color: var(--ink); }
  .login-card { background: var(--card); padding: 32px; border-radius: var(--radius); width: min(420px, 100%); position: relative; }
  .login-card h3 { margin-bottom: 8px; }
  .login-card p { color: var(--muted); font-size: .95rem; margin-bottom: 18px; }
  .err { color: var(--red); font-size: .9rem; min-height: 1.4em; margin-top: 8px; }

  /* Editor */
  #editor { position: fixed; inset: 0; z-index: 200; background: var(--paper); display: grid; grid-template-rows: auto 1fr; }
  .ed-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--ink); color: #fff; padding: 12px 20px; }
  .ed-top h2 { color: #fff; font-size: 1.15rem; }
  .ed-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ed-actions .status { font-size: .88rem; color: #c9dcd5; margin-inline-end: 6px; }
  .btn-sm { padding: 8px 14px; font-size: .9rem; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; font-weight: 600; }
  .btn-sm:hover { background: #fff; }
  .btn-sm.danger { color: var(--red); }
  .ed-body { display: grid; grid-template-columns: 250px 1fr; min-height: 0; }
  #ed-nav { overflow: auto; border-inline-end: 1px solid var(--line); background: var(--card); padding: 12px; display: grid; align-content: start; gap: 4px; }
  #ed-nav button { text-align: start; background: none; border: 0; padding: 10px 12px; border-radius: var(--radius); cursor: pointer; color: var(--text); font-size: .95rem; }
  #ed-nav button:hover { background: var(--well); }
  #ed-nav button.on { background: var(--ink); color: #fff; }
  #ed-main { overflow: auto; padding: 28px clamp(16px, 3vw, 40px) 80px; }
  #ed-main > h2 { font-size: 1.6rem; margin-bottom: 22px; }
  .fld { margin-bottom: 18px; }
  .fld > label { display: block; font-weight: 600; font-size: .92rem; color: var(--ink); margin-bottom: 6px; }
  .fld input[type=text], .fld input[type=date], .fld select, .fld textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; color: var(--text);
  }
  .fld textarea { min-height: 88px; resize: vertical; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: transparent; }
  .fld .chk { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .fld .chk input { width: 18px; height: 18px; accent-color: var(--ink); }
  .imgbox { display: grid; gap: 8px; background: var(--card); border: 1px solid var(--line); padding: 12px; border-radius: var(--radius); }
  .imgbox .media { aspect-ratio: 16 / 10; max-height: 180px; border-radius: var(--radius); }
  .imgbox .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .imgbox .hint { font-size: .82rem; color: var(--muted); }
  .list { display: grid; gap: 14px; }
  .lcard { background: var(--card); border: 1px solid var(--line); border-inline-start: 4px solid var(--gold); border-radius: var(--radius); padding: 16px; }
  .lhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 700; color: var(--ink); gap: 8px; flex-wrap: wrap; }
  .lhead .acts { display: flex; gap: 6px; }
  .lhead .acts button { background: var(--well); border: 0; width: 34px; height: 34px; border-radius: var(--radius); cursor: pointer; font-size: 1rem; }
  .lhead .acts button:disabled { opacity: .35; cursor: default; }
  .lhead .acts button.del { color: var(--red); }
  .add-btn { margin-top: 12px; background: var(--ink); color: #fff; border: 0; padding: 10px 16px; border-radius: var(--radius); cursor: pointer; font-weight: 600; }

  .toast { position: fixed; bottom: 22px; inset-inline-start: 50%; transform: translateX(50%) translateY(20px); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: var(--radius); opacity: 0; transition: .3s; pointer-events: none; z-index: 300; font-size: .95rem; }
  .toast.show { opacity: 1; transform: translateX(50%) translateY(0); }

  /* Publish confirmation */
  .dlg { z-index: 260; }
  .btn-green { background: #1f8a3c; color: #fff; border: 0; cursor: pointer; }
  .btn-green:hover { background: #17702f; }
  .btn-green:disabled { opacity: .6; cursor: default; }
  .codein { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; margin-top: 4px; }
  .copybox { width: 100%; min-height: 240px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; line-height: 1.9; background: #fff; color: var(--text); resize: vertical; }
  .float-confirm { position: fixed; bottom: 22px; inset-inline-end: 22px; z-index: 150; background: #1f8a3c; color: #fff; border: 0; padding: 14px 22px; border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px #0004; }
  .float-confirm:hover { background: #17702f; }
  .float-confirm[hidden] { display: none; }

  /* Rules */
  .rules { list-style: none; counter-reset: rule; display: grid; gap: 10px; }
  .rules li { counter-increment: rule; position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; padding-inline-start: 56px; font-size: .97rem; }
  .rules li::before { content: counter(rule); position: absolute; inset-inline-start: 16px; top: 50%; transform: translateY(-50%); font-family: "Reem Kufi", sans-serif; font-weight: 700; color: var(--gold); }
  .rnote { color: var(--gold); font-weight: 600; margin-bottom: 12px; }

  /* Responsive */
  @media (max-width: 920px) {
    .about, .battalions, .depts, .leaders { grid-template-columns: 1fr; }
    footer .cols { grid-template-columns: 1fr; }
    .ed-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    #ed-nav { flex-direction: row; overflow-x: auto; grid-auto-flow: column; grid-auto-columns: max-content; border-inline-end: 0; border-bottom: 1px solid var(--line); }
  }
  @media (max-width: 720px) {
    nav.main { display: none; width: 100%; flex-direction: column; }
    nav.main.open { display: flex; }
    .menu-btn { display: inline-block; }
    .top .btns .btn-ghost { display: none; }
    .rank { grid-template-columns: 1fr; }
    .rank-media { aspect-ratio: 4 / 3; }
    .hero { padding: 64px 0; }
    section { padding: 60px 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .hero .wrap > * { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
    .hero .wrap > *:nth-child(2) { animation-delay: .08s; }
    .hero .wrap > *:nth-child(3) { animation-delay: .16s; }
    .hero .wrap > *:nth-child(4) { animation-delay: .24s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  }
  /* Multi-page layout */
  .phead { background: var(--ink); color: #fff; padding: 56px 0 50px; border-bottom: 2px solid var(--gold); }
  .phead h1 { color: #fff; font-size: clamp(2rem, 4.5vw, 3.2rem); margin: 10px 0 12px; }
  .phead p { color: #d7e6e1; max-width: 70ch; }
  .crumbs { display: flex; gap: 8px; font-size: .9rem; color: #bcd0c9; flex-wrap: wrap; }
  .crumbs a { color: #e3c57f; text-decoration: none; }
  .crumbs span:last-child { color: #fff; }
  nav.main a.on { background: #ffffff22; opacity: 1; }
  .page { animation: fadeIn .45s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .block { padding: 64px 0; }
  .block + .block { border-top: 1px solid var(--line); }
  .home-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; padding: 72px 0 0; }
  .pcard { position: relative; display: block; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; text-decoration: none; transition: transform .2s, border-color .2s; }
  .pcard:hover { transform: translateY(-3px); border-color: var(--gold); }
  .pcard .pnum { font-family: "Reem Kufi", sans-serif; color: var(--gold); font-weight: 700; }
  .pcard h3 { font-size: 1.3rem; margin: 6px 0 8px; }
  .pcard p { color: var(--muted); font-size: .95rem; }
  .pcard .parrow { display: inline-block; margin-top: 12px; color: var(--ink-2); font-weight: 600; }
  .about-body { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
  .about-text p { font-size: 1.05rem; }
  .pager { display: block; background: var(--paper); border-top: 1px solid var(--line); }
  .pgrid { display: flex; justify-content: space-between; gap: 16px; padding: 40px 0 64px; }
  .pg { flex: 1; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px; text-decoration: none; }
  .pg:hover { border-color: var(--gold); }
  .pg small { display: block; color: var(--muted); }
  .pg b { font-family: "Reem Kufi", sans-serif; color: var(--ink); font-size: 1.1rem; }
  .sec-tools { margin-bottom: 18px; }
  .sec-tools .btn-sm { text-decoration: none; display: inline-block; }
  .btn-sm.ghost { background: transparent; color: #fff; border-color: #ffffff55; }
  .btn-sm:disabled { opacity: .4; cursor: default; }
  @media (max-width: 920px) { .about-body { grid-template-columns: 1fr; } .home-cards { padding-top: 48px; } }
  /* Custom content blocks and section manager */
  .blk { margin-bottom: 36px; }
  .blk h3 { font-size: 1.35rem; margin-bottom: 10px; padding-inline-start: 14px; border-inline-start: 3px solid var(--gold); }
  .blk p { font-size: 1.05rem; color: var(--text); }
  .blk-list { list-style: none; display: grid; gap: 10px; }
  .blk-list li { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; padding-inline-start: 36px; }
  .blk-list li::before { content: ""; position: absolute; inset-inline-start: 14px; top: 1.1em; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
  .blk-img { margin-bottom: 36px; }
  .blk-img .media { aspect-ratio: 16 / 9; }
  .blk-img figcaption { margin-top: 10px; color: var(--muted); font-size: .95rem; }
  .hint { color: var(--muted); font-size: .92rem; margin-bottom: 18px; }
  .navrow .lhead span { font-weight: 700; }
</style>
</head>
<body>
<div id="announce" class="announce" hidden></div>

<header class="top">
  <div class="wrap">
    <a class="brand" id="brand" href="#/"></a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="mainnav">القائمة</button>
    <nav class="main" id="mainnav"></nav>
    <div class="btns">
      <a class="btn btn-ghost" id="hdr-discord1" href="#" target="_blank" rel="noopener">أنضم إلى فالي</a>
      <a class="btn btn-gold" id="hdr-discord2" href="#" target="_blank" rel="noopener">إلى وزارة الصحة</a>
      <button class="btn btn-dark" id="hdr-admin" hidden>لوحة التحرير</button>
    </div>
  </div>
</header>

<main>
  <div class="page" data-page="home" id="page-home">
    <div class="hero" id="r-hero"></div>
    <div class="stats" id="r-stats"></div>
    <section class="wrap"><div class="home-cards" id="r-cards"></div></section>
    <section class="block" id="sec-faq"><div class="wrap faq" id="r-faq"></div></section>
    <div class="cta" id="r-cta"></div>
  </div>

  <div class="page" data-page="about" id="page-about" hidden>
    <div class="phead" id="h-about"></div>
    <section class="block"><div class="wrap" id="r-about"></div></section>
    <section class="block" id="sec-departments"><div class="wrap" id="r-departments"></div></section>
    <section class="block" id="sec-leaders"><div class="wrap" id="r-leaders"></div></section>
  </div>

  <div class="page" data-page="ranks" id="page-ranks" hidden>
    <div class="phead" id="h-ranks"></div>
    <section class="block"><div class="wrap" id="r-ranks"></div></section>
  </div>

  <div class="page" data-page="battalions" id="page-battalions" hidden>
    <div class="phead" id="h-battalions"></div>
    <section class="block"><div class="wrap" id="r-battalions"></div></section>
  </div>

  <div class="page" data-page="rules" id="page-rules" hidden>
    <div class="phead" id="h-rules"></div>
    <section class="block"><div class="wrap" id="r-rules"></div></section>
  </div>

  <div id="dyn-pages"></div>

  <nav class="pager" id="pager" hidden></nav>
</main>

<footer id="r-footer"></footer>

<div class="overlay" id="lightbox" hidden role="dialog" aria-modal="true">
  <button class="x-btn" id="lb-close" aria-label="إغلاق">×</button>
  <img class="lb-img" id="lb-img" src="" alt="">
</div>

<div class="overlay" id="login" hidden role="dialog" aria-modal="true" aria-labelledby="login-title">
  <div class="login-card">
    <h3 id="login-title">دخول المسؤولين</h3>
    <p>أدخل الكود الخاص لفتح لوحة التحرير.</p>
    <input class="codein" type="password" id="code" placeholder="أدخل الكود" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <div class="btns" style="margin-top:14px">
      <button class="btn btn-green" id="loginGo">دخول</button>
      <button class="btn-sm" id="loginCancel">إلغاء</button>
    </div>
  </div>
</div>

<div id="editor" hidden role="dialog" aria-modal="true" aria-label="لوحة التحرير">
  <div class="ed-top">
    <h2>لوحة التحرير</h2>
    <div class="ed-actions">
      <span class="status" id="saveStatus">لا توجد تعديلات بانتظار النشر</span>
      <button class="btn-sm ghost" id="undoBtn" disabled>تراجع (Ctrl+Z)</button>
      <button class="btn-sm btn-green" id="confirmBtn">تأكيد التعديلات</button>
      <button class="btn-sm" id="exportBtn">تنزيل نسخة احتياطية</button>
      <button class="btn-sm danger" id="resetBtn">إعادة الضبط</button>
      <button class="btn-sm ghost" id="viewBtn">إغلاق والعودة للموقع</button>
      <button class="btn-sm ghost" id="logoutBtn">خروج</button>
    </div>
  </div>
  <div class="ed-body">
    <nav id="ed-nav" aria-label="أقسام المحرر"></nav>
    <div id="ed-main"></div>
  </div>
</div>

<button class="float-confirm" id="floatConfirm" hidden>تأكيد التعديلات</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script>
(() => {
  const API = "/.netlify/functions/content";
  const isHosted = location.protocol.startsWith("http");
  const CHANGES_KEY = "moh-changes";
  const DRAFT_KEY = "moh-draft";
  const BUILTIN = { about: "عام وزارة الصحة", ranks: "الرتب والملابس", battalions: "الكتائب", rules: "القوانين" };

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const lines = s => String(s ?? "").split("\n").map(x => x.trim()).filter(Boolean);
  const clone = o => JSON.parse(JSON.stringify(o));
  const isAdmin = () => sessionStorage.getItem("moh-admin") === "1";
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };

  // Fill in anything missing from older saved content so every version loads cleanly
  function normalize(x) {
    const d = clone(x);
    d.visible = d.visible || {};
    if (!Array.isArray(d.nav)) {
      d.nav = Object.keys(BUILTIN).map(id => ({ id, label: BUILTIN[id], visible: d.visible[id] !== false }));
    }
    if (!Array.isArray(d.pages)) d.pages = [];
    d.pages.forEach(p => { p.blocks = Array.isArray(p.blocks) ? p.blocks : []; });
    return d;
  }

  const EMBED = normalize(JSON.parse(document.getElementById("site-data").textContent));
  let D = clone(EMBED);
  let currentKey = "site";
  let sectionLabel = "";
  let timer;
  let changes = [];
  let history = [];
  let pendingBase = null;
  let lastState = JSON.stringify(D);
  try { changes = JSON.parse(sessionStorage.getItem(CHANGES_KEY) || "[]"); } catch (e) { changes = []; }

  const hijri = new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura", { year: "numeric", month: "long", day: "numeric" });
  const greg = new Intl.DateTimeFormat("ar-SA-u-ca-gregory", { year: "numeric", month: "long", day: "numeric" });
  function dateLine(iso) {
    if (!iso) return "لم يُحدد تاريخ التعيين";
    const d = new Date(iso + "T12:00:00");
    return `${hijri.format(d)} هـ | ${greg.format(d)} م`;
  }

  const imgOrEmpty = (src, alt) => src ? `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.parentNode.classList.add('broken')">` : "";
  const zoomAttr = src => src ? `data-zoom-src="${esc(src)}" role="button" tabindex="0"` : "";
  const logoHTML = cls => `<span class="logo ${cls}"><img src="${esc(D.site.logo)}" alt="شعار الوزارة" onerror="this.parentNode.classList.add('nologo')"><span class="fb">و</span></span>`;
  const secHead = (t, d) => `<div class="sec-head"><h2>${esc(t)}</h2>${d ? `<p>${esc(d)}</p>` : ""}</div>`;
  const phead = (title, desc) => `<div class="wrap"><nav class="crumbs"><a href="#/">الرئيسية</a><span>/</span><span>${esc(title)}</span></nav><h1>${esc(title)}</h1>${desc ? `<p>${esc(desc)}</p>` : ""}</div>`;

  // ---------- Pages and sections ----------
  const navItem = id => D.nav.find(n => n.id === id);
  const customPage = id => D.pages.find(p => p.id === id);
  const isCustom = id => !!customPage(id);
  const isNavVisible = id => { const n = navItem(id); return !!n && n.visible !== false; };
  const isSubVisible = k => !(D.visible && D.visible[k] === false);

  function pageTitle(id) {
    if (BUILTIN[id]) return D[id].title;
    const p = customPage(id);
    return p ? p.title : id;
  }
  function pageDesc(id) {
    const map = { about: D.about.p1, ranks: D.ranks.desc, battalions: D.battalions.desc, rules: D.rules.intro };
    if (map[id] !== undefined) return map[id];
    const p = customPage(id);
    return p ? (p.desc || "") : "";
  }
  function uniqueId(name) {
    let slug = String(name).trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    if (!slug || BUILTIN[slug] || navItem(slug) || customPage(slug)) slug = "sec-" + Date.now().toString(36);
    return slug;
  }
  function currentRoute() {
    const h = location.hash.replace(/^#\/?/, "").trim();
    return navItem(h) ? h : "home";
  }

  function renderBlock(b) {
    const title = b.title ? `<h3>${esc(b.title)}</h3>` : "";
    if (b.type === "image") {
      return `<figure class="blk-img">${title}<div class="media ${b.image ? "" : "empty"}" ${zoomAttr(b.image)}>${imgOrEmpty(b.image, b.caption)}</div>${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ""}</figure>`;
    }
    if (b.type === "bullets") {
      return `<div class="blk">${title}<ul class="blk-list">${lines(b.points).map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`;
    }
    if (b.type === "numbered") {
      return `<div class="blk">${title}<ol class="rules">${lines(b.points).map(p => `<li>${esc(p)}</li>`).join("")}</ol></div>`;
    }
    return `<div class="blk">${title}${b.text ? `<p>${esc(b.text)}</p>` : ""}</div>`;
  }

  function renderPager(r) {
    const pager = $("pager");
    if (r === "home") { pager.hidden = true; pager.innerHTML = ""; return; }
    const list = D.nav.filter(n => n.visible !== false).map(n => n.id);
    const i = list.indexOf(r);
    const prev = list[i - 1], next = list[i + 1];
    pager.hidden = false;
    pager.innerHTML = `<div class="wrap pgrid">
      ${prev ? `<a class="pg" href="#/${esc(prev)}"><small>الصفحة السابقة</small><b>${esc(pageTitle(prev))}</b></a>` : "<span></span>"}
      ${next ? `<a class="pg next" href="#/${esc(next)}"><small>الصفحة التالية</small><b>${esc(pageTitle(next))}</b></a>` : "<span></span>"}
    </div>`;
  }

  function applyRoute(scroll = true) {
    let r = currentRoute();
    if (r !== "home" && !isNavVisible(r)) r = "home";
    document.querySelectorAll(".page").forEach(p => { p.hidden = p.dataset.page !== r; });
    document.querySelectorAll("nav.main a[data-route]").forEach(a => {
      a.classList.toggle("on", a.dataset.route === r);
      a.hidden = a.dataset.route !== "home" && !isNavVisible(a.dataset.route);
    });
    document.title = r === "home" ? `${D.site.title} | ${D.site.subtitle}` : `${pageTitle(r)} | ${D.site.title}`;
    renderPager(r);
    if (scroll) window.scrollTo(0, 0);
  }

  function renderAll() {
    const S = D.site, A = D.announce, admin = isAdmin();

    const ab = $("announce");
    const showA = A.enabled && String(A.text).trim() && (A.audience === "all" || admin);
    ab.hidden = !showA;
    ab.textContent = A.text;
    ab.classList.toggle("admin-only", A.audience === "admin");

    $("brand").innerHTML = logoHTML("brand-logo") + `<span><b>${esc(S.title)}</b><small>${esc(S.subtitle)}</small></span>`;
    $("hdr-discord1").href = S.discord;
    $("hdr-discord2").href = S.discord;
    $("hdr-admin").hidden = !admin;
    document.querySelector('link[rel="icon"]').href = S.logo;

    $("mainnav").innerHTML = `<a href="#/" data-route="home">الرئيسية</a>` +
      D.nav.map(n => `<a href="#/${esc(n.id)}" data-route="${esc(n.id)}">${esc(n.label)}</a>`).join("");

    const H = D.hero;
    $("r-hero").innerHTML = `<div class="wrap">
      <p class="kicker">${esc(H.kicker)}</p>
      <h1>${esc(H.title)}</h1>
      <p class="lead">${esc(H.lead)}</p>
      <div class="btns">
        <a class="btn btn-gold" href="${esc(S.discord)}" target="_blank" rel="noopener">${esc(H.btn1)}</a>
        <a class="btn btn-ghost" href="#/ranks">${esc(H.btn2)}</a>
      </div></div>`;

    $("r-stats").innerHTML = `<div class="wrap">` + D.stats.map(s =>
      `<div class="stat"><strong>${esc(s.num)}</strong><span>${esc(s.label)}</span></div>`).join("") + `</div>`;

    $("r-cards").innerHTML = D.nav.filter(n => n.visible !== false).map((n, i) => `
      <a class="pcard" href="#/${esc(n.id)}">
        <span class="pnum">${String(i + 1).padStart(2, "0")}</span>
        <h3>${esc(pageTitle(n.id))}</h3>
        <p>${esc(pageDesc(n.id))}</p>
        <span class="parrow">افتح الصفحة ←</span>
      </a>`).join("");

    $("h-about").innerHTML = phead(D.about.title, D.about.p1);
    $("r-about").innerHTML = `<div class="about-body">
      <div class="principles">${D.about.principles.map(p =>
        `<div class="principle"><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></div>`).join("")}</div>
      <div class="about-text"><p>${esc(D.about.p2)}</p></div></div>`;

    const DP = D.departments;
    $("r-departments").innerHTML = secHead(DP.title, DP.desc) + `<div class="depts">${DP.items.map(d => `
      <article class="dept">
        <h3>${esc(d.title)}</h3>
        <p>${esc(d.desc)}</p>
        <ul>${lines(d.points).map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      </article>`).join("")}</div>`;

    const L = D.leaders;
    $("r-leaders").innerHTML = secHead(L.title, L.desc) + `<div class="leaders">${L.items.map(l => `
      <article class="leader ${l.top ? "top" : ""}">
        <div class="seal">${esc(String(l.role || "").charAt(0))}</div>
        <div>
          <div class="role">${esc(l.role)}</div>
          <h3>${esc(l.name)}</h3>
          <div class="meta">${l.handle ? esc(l.handle) + " · " : ""}الرقم: <span class="ltr">${esc(l.id)}</span></div>
          <time>${dateLine(l.date)}</time>
        </div>
      </article>`).join("")}</div>`;

    $("h-ranks").innerHTML = phead(D.ranks.title, D.ranks.desc);
    $("r-ranks").innerHTML = `<div class="ladder">${D.ranks.items.map(it => `
        <article class="rank">
          <div class="media rank-media ${it.image ? "" : "empty"}" ${zoomAttr(it.image)}>${imgOrEmpty(it.image, it.title)}</div>
          <div class="rank-body"><div class="tier">${esc(it.tier)}</div><h3>${esc(it.title)}</h3><p>${esc(it.desc)}</p></div>
        </article>`).join("")}</div>` +
      D.uniforms.groups.map(g => `
        <div class="ugroup">
          <h3>${esc(g.title)}</h3>
          <p>${esc(g.desc)}</p>
          <div class="gallery">${g.items.map(it => `
            <figure class="ufig">
              <div class="media ${it.image ? "" : "empty"}" ${zoomAttr(it.image)}>${imgOrEmpty(it.image, it.caption)}</div>
              <figcaption>${esc(it.caption)}</figcaption>
            </figure>`).join("")}</div>
        </div>`).join("");

    $("h-battalions").innerHTML = phead(D.battalions.title, D.battalions.desc);
    $("r-battalions").innerHTML = `<div class="battalions">${D.battalions.items.map((b, i) => `
        <article class="bat ${i === 0 ? "featured" : ""} ${b.soon ? "soon" : ""}">
          <div class="bat-top"><h3>${esc(b.name)}</h3>${b.code ? `<span class="code">${esc(b.code)}</span>` : ""}</div>
          <p>${esc(b.desc)}</p>
          <div class="cmd">${b.soon
            ? `<span class="badge-soon">قريبًا</span> · لم يتم تعيين قائد بعد`
            : `<b>القائد:</b> ${esc(b.cmdName)}${b.cmdId ? ` · صاحب الأيدي: <span class="ltr">${esc(b.cmdId)}</span>` : ""}`}</div>
        </article>`).join("")}</div>`;

    $("h-rules").innerHTML = phead(D.rules.title, D.rules.intro);
    $("r-rules").innerHTML = (D.rules.items || []).map(g => `
      <div class="ugroup">
        <h3>${esc(g.title)}</h3>
        ${g.note ? `<p class="rnote">${esc(g.note)}</p>` : ""}
        <ol class="rules">${(g.rules || []).map(r => `<li>${esc(r.text)}</li>`).join("")}</ol>
      </div>`).join("");

    $("dyn-pages").innerHTML = D.pages.map(p => `
      <div class="page" data-page="${esc(p.id)}" hidden>
        <div class="phead">${phead(p.title, p.desc)}</div>
        <section class="block"><div class="wrap">${(p.blocks || []).map(renderBlock).join("")}</div></section>
      </div>`).join("");

    $("r-faq").innerHTML = secHead(D.faq.title) + D.faq.items.map(q =>
      `<details><summary>${esc(q.q)}</summary><p>${esc(q.a)}</p></details>`).join("");

    const C = D.cta;
    $("r-cta").innerHTML = `<div class="wrap">
      <div><h2>${esc(C.title)}</h2><p>${esc(C.text)}</p></div>
      <a class="btn btn-dark" href="${esc(S.discord)}" target="_blank" rel="noopener">${esc(C.btn)}</a>
    </div>`;

    const footLinks = D.nav.filter(n => n.visible !== false).map(n => `<a href="#/${esc(n.id)}">${esc(n.label)}</a>`).join("");
    $("r-footer").innerHTML = `<div class="wrap"><div class="cols">
      <div>${logoHTML("foot-logo")}<h4>${esc(S.title)} | ${esc(S.subtitle)}</h4><p>${esc(D.footer.about)}</p></div>
      <div><h4>الصفحات</h4>${footLinks}</div>
      <div><h4>تواصل معنا</h4>
        <a href="${esc(S.discord)}" target="_blank" rel="noopener">سيرفر ديسكورد</a>
        <a href="#/">الرئيسية</a>
        <button class="linkbtn" data-action="login">دخول المسؤولين</button></div>

  function touch(label, from, to) {
    if (pendingBase === null) pendingBase = { state: lastState, n: changes.length };
    const text = (sectionLabel ? sectionLabel + " ← " : "") + (label || "تعديل");
    const last = changes[changes.length - 1];
    if (last && last.text === text && last.from !== undefined && from !== undefined) {
      last.to = to;
    } else {
      const entry = { text };
      if (from !== undefined) { entry.from = from; entry.to = to; }
      changes.push(entry);
    }
    clearTimeout(timer);
    timer = setTimeout(() => { saveDraft(); renderAll(); }, 250);
  }

  function saveDraft() {
    if (pendingBase !== null) {
      history.push(pendingBase);
      if (history.length > 50) history.shift();
      pendingBase = null;
    }
    lastState = JSON.stringify(D);
    try { localStorage.setItem(DRAFT_KEY, lastState); } catch (e) {}
    try { sessionStorage.setItem(CHANGES_KEY, JSON.stringify(changes)); } catch (e) {}
    updateBar();
  }

  function undo() {
    let entry;
    if (pendingBase) { entry = pendingBase; pendingBase = null; clearTimeout(timer); }
    else entry = history.pop();
    if (!entry) { flash("لا يوجد تعديل للتراجع عنه"); return; }
    D = normalize(JSON.parse(entry.state));
    lastState = entry.state;
    changes.length = entry.n;
    saveDraft();
    renderAll();
    showSection(currentKey);
    flash("تم التراجع عن آخر تعديل");

        card.append(field);

      row.append(okB, noB);

      document.body.append(wrap);
      const done = v => { wrap.remove(); resolve(v); };

  function fmtVal(v) {
    if (typeof v === "boolean") return v ? "مفعّل" : "معطّل";
    if (v === undefined || v === null || String(v).trim() === "") return "فارغ";
    if (String(v).startsWith("data:")) return "صورة";
    const s = String(v).replace(/\s+/g, " ").trim();
    return s.length > 300 ? s.slice(0, 300) + "…" : s;
  }

  function stamp(date) {
    const hd = new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura", { year: "numeric", month: "long", day: "numeric", timeZone: "Asia/Riyadh" }).format(date);
    const gd = new Intl.DateTimeFormat("ar-SA-u-ca-gregory", { year: "numeric", month: "long", day: "numeric", timeZone: "Asia/Riyadh" }).format(date);
    const tm = new Intl.DateTimeFormat("ar-SA", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Riyadh" }).format(date);
    return `التاريخ: ${hd} هـ | ${gd} م\nالساعة: ${tm} بتوقيت مكة المكرمة`;
  }

  }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 1100;
          const s = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * s);
          c.height = Math.round(img.height * s);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/webp", 0.85));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function fieldEl(obj, f, rerender) {
    const wrap = el("div", "fld");

    if (f.type === "bool") {
      const lab = el("label", "chk");
      const cb = el("input");
      cb.type = "checkbox";
      cb.checked = !!obj[f.k];
      cb.onchange = () => { const from = !cb.checked; obj[f.k] = cb.checked; touch(lbl(obj, f), from, cb.checked); };
      lab.append(cb, document.createTextNode(f.label));
      wrap.append(lab);
      return wrap;
    }

    wrap.append(el("label", "", f.label));

    if (f.type === "list") {
      if (!Array.isArray(obj[f.k])) obj[f.k] = [];
      wrap.append(listEl(obj[f.k], f.fields, rerender, f.item));
      return wrap;
    }

    if (f.type === "image") {
      const box = el("div", "imgbox");
      const prev = el("div", "media");
      const img = el("img");
      img.alt = "";
      img.onerror = () => prev.classList.add("broken");
      prev.append(img);
      const url = el("input");
      url.type = "text";
      url.placeholder = "رابط الصورة (https://...)";
      url.value = String(obj[f.k] || "").startsWith("data:") ? "" : (obj[f.k] || "");
      const row = el("div", "row");
      const file = el("input");
      file.type = "file";
      file.accept = "image/*";
      const rm = el("button", "btn-sm danger", "إزالة الصورة");
      rm.type = "button";
      row.append(file, rm);
      box.append(prev, url, row, el("div", "hint", "يمكنك لصق رابط صورة أو رفع ملف. الملفات المرفوعة تُضغط وتُحفظ مع الموقع."));

      const preview = () => {
        const v = obj[f.k] || "";
        prev.className = "media" + (v ? "" : " empty");
        img.src = v;
      };
      preview();
      url.oninput = () => { const from = obj[f.k] ? "صورة" : "فارغ"; obj[f.k] = url.value.trim(); preview(); touch(lbl(obj, f), from, url.value.trim() ? "رابط صورة جديد" : "فارغ"); };
      file.onchange = () => {
        const x = file.files[0];
        if (!x) return;
        const had = obj[f.k];
        compressImage(x).then(d => {
          obj[f.k] = d;
          url.value = "";
          preview();
          touch(lbl(obj, f), had ? "صورة قديمة" : "فارغ", "صورة جديدة (مرفوعة)");
          flash("تم رفع الصورة");
        }).catch(() => flash("تعذر قراءة الصورة"));
      };
      rm.onclick = () => { const from = obj[f.k] ? "صورة" : "فارغ"; obj[f.k] = ""; url.value = ""; preview(); touch(lbl(obj, f), from, "فارغ"); };
      wrap.append(box);
      return wrap;
    }

    let ctl;
    if (f.type === "textarea") {
      ctl = el("textarea");
    } else if (f.type === "select") {
      if (!obj[f.k]) obj[f.k] = f.options[0][0];
      ctl = el("select");
      f.options.forEach(([v, t]) => { const o = el("option", "", t); o.value = v; ctl.append(o); });
    } else {
      ctl = el("input");
      ctl.type = f.type === "date" ? "date" : "text";
    }
    ctl.value = obj[f.k] ?? "";
    let prevV = obj[f.k] ?? "";
    ctl.oninput = ctl.onchange = () => { const from = prevV; obj[f.k] = ctl.value; touch(lbl(obj, f), from, ctl.value); prevV = ctl.value; };
    wrap.append(ctl);
    return wrap;
  }

  function listEl(arr, fields, rerender, itemLabel) {
    const wrap = el("div", "list");
    const change = (d) => { touch(d); rerender(); };
    arr.forEach((item, i) => {
      const card = el("div", "lcard");
      const headEl = el("div", "lhead");
      headEl.append(el("span", "", `${itemLabel || "عنصر"} ${i + 1}`));
      const acts = el("div", "acts");
      const up = el("button", "", "↑");
      up.title = "تحريك للأعلى";
      up.disabled = i === 0;
      up.onclick = () => { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; change(`تحريك ${itemLabel || "عنصر"} ${i + 1}`); };
      const down = el("button", "", "↓");
      down.title = "تحريك للأسفل";
      down.disabled = i === arr.length - 1;
      down.onclick = () => { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; change(`تحريك ${itemLabel || "عنصر"} ${i + 1}`); };
      const dup = el("button", "", "⧉");
      dup.title = "نسخ";
      dup.onclick = () => { arr.splice(i + 1, 0, JSON.parse(JSON.stringify(item))); change(`نسخ ${itemLabel || "عنصر"} ${i + 1}`); };
      const del = el("button", "del", "🗑");
      del.title = "حذف";
      del.onclick = () => { if (confirm("هل تريد حذف هذا العنصر؟")) { arr.splice(i, 1); change(`حذف ${itemLabel || "عنصر"} ${i + 1}`); } };
      acts.append(up, down, dup, del);
      headEl.append(acts);
      card.append(headEl);
      fields.forEach(f => card.append(fieldEl(item, f, rerender)));
      wrap.append(card);
    });
    const add = el("button", "add-btn", "+ إضافة " + (itemLabel || "عنصر"));
    add.type = "button";
    add.onclick = () => { arr.push(blankItem(fields)); change(`إضافة ${itemLabel || "عنصر"} جديد`); };
    wrap.append(add);
    return wrap;
  }

  // Manager for section names, order, visibility, and adding new sections
  function renderNavManager(m, rerender) {
    m.append(el("p", "hint", "من هنا تتحكم بأسماء الأقسام في القائمة وترتيبها وإظهارها. الأقسام الأساسية لا تُحذف، لكن يمكن إخفاؤها. الأقسام الجديدة تظهر تلقائيًا في القائمة وفي الصفحة الرئيسية."));

    const add = el("button", "add-btn", "+ إضافة قسم جديد");
    add.type = "button";
    add.onclick = async () => {
      const name = await dialog({ title: "قسم جديد", body: "اكتب اسم القسم كما سيظهر في القائمة.", ok: "إضافة", input: true, inputType: "text", placeholder: "مثال: الإدارة العليا" });
      if (!name) return;
      const clean = String(name).trim();
      if (!clean) return;
      const id = uniqueId(clean);
      D.nav.push({ id, label: clean, visible: true });
      D.pages.push({ id, title: clean, desc: "", blocks: [] });
      touch(`إضافة قسم جديد: ${clean}`);
      showSection("custom:" + id);
    };
    m.append(add);

    D.nav.forEach((n, i) => {
      const card = el("div", "lcard navrow");
      const headEl = el("div", "lhead");
      headEl.append(el("span", "", `${i + 1}. ${n.label}`));
      const acts = el("div", "acts");

      const up = el("button", "", "↑");
      up.title = "تحريك للأعلى";
      up.disabled = i === 0;
      up.onclick = () => { [D.nav[i - 1], D.nav[i]] = [D.nav[i], D.nav[i - 1]]; touch(`ترتيب القائمة: ${n.label}`); rerender(); };

      const down = el("button", "", "↓");
      down.title = "تحريك للأسفل";
      down.disabled = i === D.nav.length - 1;
      down.onclick = () => { [D.nav[i + 1], D.nav[i]] = [D.nav[i], D.nav[i + 1]]; touch(`ترتيب القائمة: ${n.label}`); rerender(); };

      const open = el("button", "", "تعديل المحتوى");
      open.onclick = () => showSection(isCustom(n.id) ? "custom:" + n.id : n.id);

      const del = el("button", "del", "🗑");
      if (isCustom(n.id)) {
        del.title = "حذف القسم";
        del.onclick = () => deletePage(n.id);
      } else {
        del.disabled = true;
        del.title = "الأقسام الأساسية لا تُحذف، أخفها فقط";
      }

      acts.append(up, down, open, del);
      headEl.append(acts);
      card.append(headEl);

      const lab = el("div", "fld");
      lab.append(el("label", "", "اسم القسم في القائمة"));
      const inp = el("input");
      inp.type = "text";
      inp.value = n.label;
      let prevL = n.label;
      inp.oninput = () => { const from = prevL; n.label = inp.value; touch("اسم القسم في القائمة", from, inp.value); prevL = inp.value; refreshNav(); };
      lab.append(inp);

      const vis = el("label", "chk");
      const cb = el("input");
      cb.type = "checkbox";
      cb.checked = n.visible !== false;
      cb.onchange = () => { n.visible = cb.checked; touch(`${cb.checked ? "إظهار" : "إخفاء"} القسم: ${n.label}`); };
      vis.append(cb, document.createTextNode("يظهر هذا القسم في الموقع"));

      card.append(lab, vis);
      m.append(card);
    });
  }

  function deletePage(id) {
    const n = navItem(id);
    const label = n ? n.label : id;
    if (!confirm(`حذف القسم "${label}" نهائيًا؟`)) return;
    D.nav = D.nav.filter(x => x.id !== id);
    D.pages = D.pages.filter(p => p.id !== id);
    touch(`حذف القسم: ${label}`);
    showSection("pages");
  }

  function refreshNav() {
    const nav = $("ed-nav");
    if (!nav) return;
    const items = schema();
    const btns = nav.querySelectorAll("button");
    if (btns.length !== items.length) { buildNav(); return; }
    items.forEach((s, i) => { btns[i].textContent = s.label; btns[i].dataset.key = s.key; btns[i].classList.toggle("on", s.key === currentKey); });
  }

  function buildNav() {
    const nav = $("ed-nav");
    nav.innerHTML = "";
    schema().forEach(s => {
      const b = el("button", "", s.label);
      b.dataset.key = s.key;
      b.classList.toggle("on", s.key === currentKey);
      b.onclick = () => showSection(s.key);
      nav.append(b);
    });
  }

  function showSection(key) {
    const items = schema();
    const s = items.find(x => x.key === key) || items[0];
    currentKey = s.key;
    sectionLabel = s.label;
    buildNav();

    const m = $("ed-main");
    m.innerHTML = "";
    m.append(el("h2", "", s.label));

    const tools = el("div", "sec-tools");
    const target = pageTarget(s.key);
    const view = el("button", "btn-sm", target === "home" ? "عرض الصفحة الرئيسية" : "عرض هذه الصفحة في الموقع");
    view.onclick = () => {
      $("editor").hidden = true;
      location.hash = target === "home" ? "#/" : "#/" + target;
    };
    tools.append(view);
    if (s.custom_page) {
      const del = el("button", "btn-sm danger", "حذف هذا القسم");
      del.onclick = () => deletePage(s.custom_page);
      tools.append(del);
    }
    m.append(tools);

    const rerender = () => { const y = $("ed-main").scrollTop; showSection(currentKey); $("ed-main").scrollTop = y; };
    if (s.custom) { s.custom(m, rerender); return; }
    if (s.list) { m.append(listEl(s.get ? s.get() : D[s.key], s.fields, rerender, s.item)); return; }
    const obj = s.get ? s.get() : D[s.key];
    s.fields.forEach(f => m.append(fieldEl(obj, f, rerender)));
  }

  function openEditor() {
    $("editor").hidden = false;
    showSection(currentKey);
    updateBar();
  }
  function closeEditor() { $("editor").hidden = true; renderAll(); }

  function exportSite() {
    const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML.replace(
      /(<script id="site-data" type="application\/json">)[\s\S]*?(<\/script>)/,
      (_, a, b) => a + "\n" + JSON.stringify(D, null, 2).replace(/</g, "\\u003c") + "\n" + b
    );
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const a = el("a");
    a.href = URL.createObjectURL(blob);
    a.download = "valley-ministry-of-health.html";
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    flash("تم تنزيل نسخة احتياطية");
  }

  // ---------- Events ----------
  document.addEventListener("click", e => {
    const z = e.target.closest("[data-zoom-src]");
    if (z) { openLB(z.dataset.zoomSrc, ""); return; }
    if (e.target.closest("[data-action='login']")) { openLogin(); return; }
    if (e.target.closest("#hdr-admin")) { if (isAdmin()) openEditor(); }
  });

  document.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-zoom-src]")) {
      e.preventDefault();
      openLB(e.target.dataset.zoomSrc, "");
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !$("editor").hidden && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
      e.preventDefault();
      undo();
    }
    if (e.key === "Escape") {
      if (!$("lightbox").hidden) closeLB();
      else if (!$("login").hidden) closeLogin();
      else if (!$("editor").hidden) closeEditor();
    }
    if (e.key === "Enter" && e.target.id === "code") tryLogin();
  });

  window.addEventListener("hashchange", () => applyRoute(true));

  $("lb-close").onclick = closeLB;
  $("lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closeLB(); });
  $("loginGo").onclick = tryLogin;
  $("loginCancel").onclick = closeLogin;
  $("login").addEventListener("click", e => { if (e.target.id === "login") closeLogin(); });

  $("confirmBtn").onclick = confirmFlow;
  $("floatConfirm").onclick = confirmFlow;
  $("undoBtn").onclick = undo;
  $("exportBtn").onclick = exportSite;
  $("viewBtn").onclick = () => { $("editor").hidden = true; renderAll(); };
  $("logoutBtn").onclick = () => {
    sessionStorage.removeItem("moh-admin");
    sessionStorage.removeItem("moh-code");
    closeEditor();
  };
  $("resetBtn").onclick = () => {
    if (!confirm("سيتم إعادة الموقع إلى المحتوى الأصلي كتعديل يحتاج تأكيدًا. متابعة؟")) return;
    D = clone(EMBED);
    touch("إعادة ضبط كاملة للموقع");
    renderAll();
    showSection(currentKey);
    flash("تمت إعادة الضبط، اضغط تأكيد التعديلات لنشرها");
  };

  $("menuBtn").onclick = () => {
    const nav = $("mainnav");
    const open = nav.classList.toggle("open");
    $("menuBtn").setAttribute("aria-expanded", open);
  };
  $("mainnav").addEventListener("click", e => {
    if (e.target.tagName === "A") {
      $("mainnav").classList.remove("open");
      $("menuBtn").setAttribute("aria-expanded", "false");
    }
  });

  // ---------- Start ----------
  loadDraft();
  lastState = JSON.stringify(D);
  renderAll();
  if (isHosted) {
    fetch(API).then(r => (r.ok ? r.json() : null)).then(remote => {
      if (remote && remote.site) D = normalize(remote);
      loadDraft();
      lastState = JSON.stringify(D);
      renderAll();
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
